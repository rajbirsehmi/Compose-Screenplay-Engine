name: Compose Screenplay Engine CI & Release

on:
  push:
    branches: [ "main", "master", "dev" ]
    paths:
      - 'engine-screenplay/**'
      - 'engine-lint/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'release-notes.md'
      - '.github/workflows/**'
  pull_request:
    branches: [ "main", "master", "dev" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit and Lint Tests
        run: ./gradlew :engine-screenplay:testDebugUnitTest :engine-lint:test

      - name: Enable KVM
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo usermod -aG kvm $USER
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Instrumented UI Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: true
          ram-size: 4096M
          heap-size: 1024M
          disk-size: 8G
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/outputs/androidTest-results/
            **/FAILURE_*
          if-no-files-found: ignore

      - name: Build Release Artifacts
        run: ./gradlew :engine-screenplay:assembleRelease :engine-lint:assemble

      - name: Verify AAR and JAR
        run: |
          ls -R engine-screenplay/build/outputs/aar/
          ls -R engine-lint/build/libs/
          if [ ! -f engine-screenplay/build/outputs/aar/engine-screenplay-release.aar ]; then echo "AAR missing"; exit 1; fi
          if [ ! -f engine-lint/build/libs/engine-lint.jar ]; then echo "Lint JAR missing"; exit 1; fi

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(grep -m 1 "version =" engine-screenplay/build.gradle.kts | awk -F'"' '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Create Release (on main)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.VERSION, 'alpha') || contains(steps.get_version.outputs.VERSION, 'beta') }}
          files: |
            engine-screenplay/build/outputs/aar/engine-screenplay-release.aar
            engine-lint/build/libs/engine-lint.jar
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Ping JitPack
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          TAG_NAME="${{ steps.get_version.outputs.VERSION }}"
          echo "Pinging JitPack for $TAG_NAME..."
          curl -s "https://jitpack.io/api/builds/com.github.rajbirsehmi/engine/$TAG_NAME" > /dev/null
